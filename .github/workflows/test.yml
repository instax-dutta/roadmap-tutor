name: tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # roadmap.sh edits its flowcharts continuously; catch upstream drift weekly.
    - cron: "0 6 * * 1"

jobs:
  offline:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests (fixtures, no network)
        run: python3 tests/test_roadmap.py

  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Flatten every published roadmap losslessly
        run: python3 tests/test_roadmap.py --live
